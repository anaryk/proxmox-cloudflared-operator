name: ui-audit

# The advisories of the packages the web interface ships at run time. Weekly and
# when the lock file changes, and not a required check: an advisory published
# today, or a registry that does not answer, must not block a pull request.
on:
  schedule:
    - cron: "17 6 * * 1"
  push:
    paths:
      - web/package-lock.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          package-manager-cache: false
      - run: npm audit --omit=dev
        working-directory: web
