name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -tags nomsgpack -race ./...

  scripts:
    runs-on: ubuntu-latest
    env:
      # A runner without gpg or without a signature tool must fail the job, not skip the real signature checks.
      PCO_REQUIRE_CRYPTO_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - run: make test-scripts

  linux-probe:
    runs-on: ubuntu-latest
    env:
      PCO_REQUIRE_LINUX_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # sudo drops the environment, so the variables the test needs are passed on explicitly.
      - run: sudo env "PATH=$PATH" "PCO_REQUIRE_LINUX_TESTS=$PCO_REQUIRE_LINUX_TESTS" go test -tags nomsgpack -race -run 'Linux' -count=1 ./internal/resolve/
      # The tests of the socket directory that only root can run: who owns it, and its group.
      - run: sudo env "PATH=$PATH" "PCO_REQUIRE_LINUX_TESTS=$PCO_REQUIRE_LINUX_TESTS" go test -tags nomsgpack -race -count=1 -run 'SomeoneElse|ToTheGroup' ./internal/api/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build
