name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.14

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go test -tags nomsgpack -race ./...

  scripts:
    runs-on: ubuntu-latest
    env:
      # A runner without gpg, gpgv or sqv must fail the job, not skip the real signature checks.
      PCO_REQUIRE_CRYPTO_TESTS: "1"
      # Nor one without dpkg-deb or go the checks of the packages.
      PCO_REQUIRE_DEB_TESTS: "1"
      # Nor one without systemd-analyze the check of the appliance's drop-ins.
      PCO_REQUIRE_SYSTEMD_TESTS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # check-artifacts_test.sh builds small programs and reads their build tags.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # Proxmox VE 9 verifies with sqv, which the runner image does not carry;
      # check-artifacts_test.sh makes and reads templates with zstd.
      - run: sudo apt-get update && sudo apt-get install -y gpgv sqv zstd
      - run: make test-scripts

  linux-probe:
    runs-on: ubuntu-latest
    env:
      PCO_REQUIRE_LINUX_TESTS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # sudo drops the environment, so the variables the test needs are passed on explicitly.
      - run: sudo env "PATH=$PATH" "PCO_REQUIRE_LINUX_TESTS=$PCO_REQUIRE_LINUX_TESTS" go test -tags nomsgpack -race -run 'Linux' -count=1 ./internal/resolve/
      # The tests of the socket directory that only root can run: who owns it, and its group.
      - run: sudo env "PATH=$PATH" "PCO_REQUIRE_LINUX_TESTS=$PCO_REQUIRE_LINUX_TESTS" go test -tags nomsgpack -race -count=1 -run 'SomeoneElse|ToTheGroup' ./internal/api/
      # The egress filter, loaded in network namespaces of the test's own.
      - run: sudo apt-get update && sudo apt-get install -y nftables
      - run: sudo env "PATH=$PATH" "PCO_REQUIRE_LINUX_TESTS=$PCO_REQUIRE_LINUX_TESTS" go test -tags nomsgpack -race -run 'Linux' -count=1 ./internal/egress/
      # The service prefix of the appliance: its device, route, rules and table.
      - run: sudo env "PATH=$PATH" "PCO_REQUIRE_LINUX_TESTS=$PCO_REQUIRE_LINUX_TESTS" go test -tags nomsgpack -race -run 'Linux' -count=1 ./internal/appnet/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: make build

  # The web interface: lint, types, unit tests and licences, then the build and
  # its size. npm runs here and in no job that holds a secret; the jobs that
  # need the result download it.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The Node of web/.nvmrc brings the npm web/package.json names. No cache:
      # what npm installs comes from the lock file, never from an earlier run.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          package-manager-cache: false
      # The types and words the interface takes from the Go code are
      # committed; they must be what the Go code makes now.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: make ui-types ui-words && git diff --exit-code
      - run: make ui-test ui-budget
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-dist
          path: internal/web/ui/dist
          if-no-files-found: error

  build-ui:
    needs: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: internal/web/ui/dist
      - run: make build UI=1
      # The tests of internal/web/ui once more, with the interface embedded.
      - run: go test -tags nomsgpack,webui ./internal/web/ui/

  # The packages, built in two checkouts of the same commit and compared. A
  # release refuses templates whose package is not the one it builds again,
  # byte for byte, and this finds what breaks that before a release does.
  package:
    needs: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          path: first
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          path: second
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: first/go.mod
          cache-dependency-path: first/go.sum
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: first/internal/web/ui/dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: second/internal/web/ui/dist
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: check
          workdir: first
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: release --snapshot --clean --skip=sign
          workdir: first
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: release --snapshot --clean --skip=sign
          workdir: second
      - run: packaging/check-artifacts.sh --require-dpkg-deb --require-ui
        working-directory: first
      - name: Compare the two builds
        run: |
          for arch in amd64 arm64; do
            sha256sum first/dist/pco_*_"$arch".deb second/dist/pco_*_"$arch".deb
            if ! cmp first/dist/pco_*_"$arch".deb second/dist/pco_*_"$arch".deb; then
              echo "::error::The $arch package differs between two builds of the same commit; the release would refuse its templates."
              exit 1
            fi
          done

  # The appliance template for amd64, built twice from the snapshot of
  # packaging/appliance/pin.conf and compared, then booted in systemd-nspawn
  # without a network, and once more with the network of the runner.
  template:
    needs: ui
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: internal/web/ui/dist
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: release --snapshot --clean --skip=sign
      - name: Install the tools of the template
        run: |
          sudo apt-get update
          sudo apt-get install -y mmdebstrap zstd systemd-container uidmap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build the template twice
        run: |
          version=$(jq -r .version dist/metadata.json)
          packaging/appliance/build_test.sh --arch amd64 --version "$version" --deb "dist/pco_${version}_amd64.deb"
      # A snapshot's binary says what git describe says, as goreleaser stamps it.
      - name: Boot it
        run: |
          version=$(jq -r .version dist/metadata.json)
          sudo packaging/appliance/smoke.sh --version "$version" --pco-version "$(git describe --tags --always --dirty)" \
            "build/appliance/pco-appliance_${version}_amd64.tar.zst"
      - name: Boot it with a network
        run: |
          version=$(jq -r .version dist/metadata.json)
          sudo packaging/appliance/smoke.sh --with-network --version "$version" --pco-version "$(git describe --tags --always --dirty)" \
            "build/appliance/pco-appliance_${version}_amd64.tar.zst"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: template
          path: build/appliance
          if-no-files-found: error
          retention-days: 7
