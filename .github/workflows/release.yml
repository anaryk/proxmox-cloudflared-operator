name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # The web interface is built here, as in ci, and never in the job below: npm
  # and every package it installs run without a secret, without the
  # environment, and may only read the repository.
  ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The Node of web/.nvmrc brings the npm web/package.json names. No cache:
      # what npm installs comes from the lock file, never from an earlier run.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          package-manager-cache: false
      - run: make ui-test ui-budget
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-dist
          path: internal/web/ui/dist
          if-no-files-found: error

  release:
    needs: ui
    runs-on: ubuntu-latest
    # The secret lives in this environment, which only the tags of a release can
    # deploy to and a reviewer has to approve. See packaging/RELEASING.md.
    environment: release
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::The tag $TAG is not a release tag. A release is vX.Y.Z or vX.Y.Z-rc.N."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # The interface the ui job built; goreleaser embeds it with the tag webui.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: internal/web/ui/dist

      # The build cache of another branch must not flow into a signed build.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      # Everything that is installed, is installed before the key is on the runner.
      - name: Install the signature tools
        run: sudo apt-get update && sudo apt-get install -y gpgv sqv

      # With cosign on the PATH the goreleaser action checks the signature of
      # the goreleaser it downloads.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Import the release key
        env:
          PCO_RELEASE_GPG_KEY: ${{ secrets.PCO_RELEASE_GPG_KEY }}
        run: |
          if [ -z "$PCO_RELEASE_GPG_KEY" ]; then
            echo "::error::The secret PCO_RELEASE_GPG_KEY is empty. Put the armored private release key into the secrets of the release environment, a release is not made without a signature."
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$PCO_RELEASE_GPG_KEY" | gpg --batch --import
          secret=$(gpg --batch --with-colons --list-secret-keys)
          keys=$(printf '%s\n' "$secret" | grep -c '^sec:' || true)
          if [ "$keys" != 1 ]; then
            echo "::error::The secret PCO_RELEASE_GPG_KEY holds $keys private keys, expected one."
            exit 1
          fi
          fpr=$(printf '%s\n' "$secret" | awk -F: '$1 == "fpr" { print $10; exit }')
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "PCO_RELEASE_KEY_FPR=$fpr" >> "$GITHUB_ENV"

      # The installers of this commit trust the keys in scripts/install.sh. A
      # release signed with another key would be refused by every one of them.
      # There are two keys in it while one is replaced by the other.
      - name: Check the key against install.sh
        run: |
          if ! embedded=$(packaging/release-key.sh scripts/install.sh "$RUNNER_TEMP/release.gpg"); then
            echo "::error::scripts/install.sh at this tag carries no usable release key, see the line above."
            exit 1
          fi
          if ! printf '%s\n' "$embedded" | grep -Fxq "$PCO_RELEASE_KEY_FPR"; then
            echo "::error::The secret signs with $PCO_RELEASE_KEY_FPR, which is none of the release keys in scripts/install.sh (${embedded//$'\n'/ }). Nothing was built."
            exit 1
          fi

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Not left to goreleaser: a second tag on the same commit must not
          # change what this run builds.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      # The private key has done its work once goreleaser is through, whatever
      # the outcome. What follows needs the public keyring only.
      - name: Remove the private key
        if: always()
        run: |
          GNUPGHOME="$RUNNER_TEMP/gnupg" gpgconf --kill gpg-agent || true
          rm -rf "$RUNNER_TEMP/gnupg"

      # What the installer does, with the keyring it was given and neither the
      # keys of the signing home nor the word of goreleaser.
      - name: Check the release files
        env:
          TAG: ${{ github.ref_name }}
        run: |
          packaging/check-artifacts.sh --signed --version "${TAG#v}" --require-dpkg-deb --require-ui
          env -u GNUPGHOME gpgv --keyring "$RUNNER_TEMP/release.gpg" dist/checksums.txt.sig dist/checksums.txt
          env -u GNUPGHOME sqv --keyring "$RUNNER_TEMP/release.gpg" dist/checksums.txt.sig dist/checksums.txt

      # Only the highest final version is the latest release: a fix for an older
      # line, tagged after a newer version, must not become what the installer picks.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--draft=false --latest=false)
          if packaging/is-latest.sh "$TAG"; then
            flags=(--draft=false --latest)
          fi
          gh release edit "$TAG" "${flags[@]}"

      - name: Remove the public keyring
        if: always()
        run: rm -f "$RUNNER_TEMP/release.gpg"
