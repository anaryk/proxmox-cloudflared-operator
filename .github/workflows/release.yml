name: release

on:
  push:
    tags:
      - "v*"
  # A run on a tag that names the Debian snapshot the templates are built
  # from. The monthly rebuild of the template starts it so; see
  # packaging/RELEASING.md.
  workflow_dispatch:
    inputs:
      snapshot:
        description: "snapshot.debian.org timestamp (YYYYMMDDTHHMMSSZ) for the templates; empty for the one in pin.conf"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  # The web interface is built here, as in ci, and never in the jobs below: npm
  # and every package it installs run without a secret, without the
  # environment, and may only read the repository.
  ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The Node of web/.nvmrc brings the npm web/package.json names. No cache:
      # what npm installs comes from the lock file, never from an earlier run.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          package-manager-cache: false
      - run: make ui-test ui-budget
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-dist
          path: internal/web/ui/dist
          if-no-files-found: error

  # The packages and the appliance templates, built without a secret and out
  # of the environment of the key: mmdebstrap, Debian's packages and qemu run
  # here only. The job sign builds the packages again and refuses a release
  # whose templates do not carry them.
  build:
    needs: ui
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SNAPSHOT: ${{ inputs.snapshot }}
        run: |
          if [[ $REF_TYPE != tag ]] || ! [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::$TAG is not a release tag. A release is vX.Y.Z or vX.Y.Z-rc.N."
            exit 1
          fi
          if [[ -n $SNAPSHOT ]] && ! [[ $SNAPSHOT =~ ^[0-9]{8}T[0-9]{6}Z$ ]]; then
            echo "::error::The snapshot $SNAPSHOT is not a timestamp YYYYMMDDTHHMMSSZ."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: internal/web/ui/dist

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      # The packages as the job sign builds them, but neither signed nor
      # published.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: release --clean --skip=publish,sign,announce
        env:
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      # arm64 is built through qemu, which binfmt hands the binaries of the
      # other architecture to.
      - name: Install the tools of the template
        run: |
          sudo apt-get update
          sudo apt-get install -y mmdebstrap zstd systemd-container uidmap debian-archive-keyring arch-test qemu-user-static
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build the templates
        env:
          TAG: ${{ github.ref_name }}
          SNAPSHOT: ${{ inputs.snapshot }}
        run: |
          version=${TAG#v}
          for arch in amd64 arm64; do
            packaging/appliance/build.sh --arch "$arch" --version "$version" \
              --deb "dist/pco_${version}_$arch.deb" ${SNAPSHOT:+--snapshot "$SNAPSHOT"} --out build/appliance
          done

      - name: Boot the amd64 template
        env:
          TAG: ${{ github.ref_name }}
        run: sudo packaging/appliance/smoke.sh --version "${TAG#v}" "build/appliance/pco-appliance_${TAG#v}_amd64.tar.zst"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appliance
          path: build/appliance
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: [ui, build]
    runs-on: ubuntu-latest
    # The secret lives in this environment, which only the tags of a release can
    # deploy to. See packaging/RELEASING.md.
    environment: release
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    # Where goreleaser takes the templates from, and check-artifacts.sh too.
    env:
      PCO_APPLIANCE_DIR: build/appliance
    steps:
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ $REF_TYPE != tag ]] || ! [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::$TAG is not a release tag. A release is vX.Y.Z or vX.Y.Z-rc.N."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # The interface the ui job built; goreleaser embeds it with the tag webui.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: internal/web/ui/dist

      # The templates the job build made, which goreleaser lists and uploads.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: appliance
          path: build/appliance

      # The build cache of another branch must not flow into a signed build.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      # What the ui job uploaded is the interface: the tests of internal/web/ui
      # with it embedded. Go only, before anything else is installed.
      - run: go test -tags nomsgpack,webui ./internal/web/ui/

      # Everything that is installed, is installed before the key is on the runner.
      - name: Install the signature tools
        run: sudo apt-get update && sudo apt-get install -y gpgv sqv

      # With cosign on the PATH the goreleaser action checks the signature of
      # the goreleaser it downloads.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Import the release key
        env:
          PCO_RELEASE_GPG_KEY: ${{ secrets.PCO_RELEASE_GPG_KEY }}
        run: |
          if [ -z "$PCO_RELEASE_GPG_KEY" ]; then
            echo "::error::The secret PCO_RELEASE_GPG_KEY is empty. Put the armored private release key into the secrets of the release environment, a release is not made without a signature."
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$PCO_RELEASE_GPG_KEY" | gpg --batch --import
          secret=$(gpg --batch --with-colons --list-secret-keys)
          keys=$(printf '%s\n' "$secret" | grep -c '^sec:' || true)
          if [ "$keys" != 1 ]; then
            echo "::error::The secret PCO_RELEASE_GPG_KEY holds $keys private keys, expected one."
            exit 1
          fi
          fpr=$(printf '%s\n' "$secret" | awk -F: '$1 == "fpr" { print $10; exit }')
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "PCO_RELEASE_KEY_FPR=$fpr" >> "$GITHUB_ENV"

      # The installers of this commit trust the keys in scripts/install.sh. A
      # release signed with another key would be refused by every one of them.
      # There are two keys in it while one is replaced by the other.
      - name: Check the key against install.sh
        run: |
          if ! embedded=$(packaging/release-key.sh scripts/install.sh "$RUNNER_TEMP/release.gpg"); then
            echo "::error::scripts/install.sh at this tag carries no usable release key, see the line above."
            exit 1
          fi
          if ! printf '%s\n' "$embedded" | grep -Fxq "$PCO_RELEASE_KEY_FPR"; then
            echo "::error::The secret signs with $PCO_RELEASE_KEY_FPR, which is none of the release keys in scripts/install.sh (${embedded//$'\n'/ }). Nothing was built."
            exit 1
          fi

      # It builds the packages again, from the same tag, lists the templates
      # in checksums.txt and leaves a draft.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Not left to goreleaser: a second tag on the same commit must not
          # change what this run builds.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      # The private key has done its work once goreleaser is through, whatever
      # the outcome. What follows needs the public keyring only.
      - name: Remove the private key
        if: always()
        run: |
          GNUPGHOME="$RUNNER_TEMP/gnupg" gpgconf --kill gpg-agent || true
          rm -rf "$RUNNER_TEMP/gnupg"

      # What the installer does, with the keyring it was given and neither the
      # keys of the signing home nor the word of goreleaser. With
      # --require-template it also refuses a template whose package is not
      # the one built here, byte for byte.
      - name: Check the release files
        env:
          TAG: ${{ github.ref_name }}
        run: |
          packaging/check-artifacts.sh --signed --version "${TAG#v}" --require-dpkg-deb --require-ui --require-template
          env -u GNUPGHOME gpgv --keyring "$RUNNER_TEMP/release.gpg" dist/checksums.txt.sig dist/checksums.txt
          env -u GNUPGHOME sqv --keyring "$RUNNER_TEMP/release.gpg" dist/checksums.txt.sig dist/checksums.txt

      - name: Remove the public keyring
        if: always()
        run: rm -f "$RUNNER_TEMP/release.gpg"

  # The draft is published only here, once the maintainer approved the
  # deployment to this environment; nothing else publishes a release.
  publish:
    needs: sign
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      # is-latest.sh reads the tags of the repository.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Only the highest final version is the latest release: a fix for an older
      # line, tagged after a newer version, must not become what the installer picks.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--draft=false --latest=false)
          if packaging/is-latest.sh "$TAG"; then
            flags=(--draft=false --latest)
          fi
          gh release edit "$TAG" "${flags[@]}"
