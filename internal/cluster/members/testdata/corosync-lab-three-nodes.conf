logging {
  debug: off
  to_syslog: yes
}

nodelist {
  node {
    name: pco-lab-1
    nodeid: 1
    quorum_votes: 1
    ring0_addr: 10.254.77.11
  }
  node {
    name: pco-lab-2
    nodeid: 2
    quorum_votes: 1
    ring0_addr: 10.254.77.12
  }
  node {
    name: pco-lab-3
    nodeid: 3
    quorum_votes: 1
    ring0_addr: 10.254.77.13
  }
}

quorum {
  provider: corosync_votequorum
}

totem {
  cluster_name: pco-lab
  config_version: 7
  interface {
    linknumber: 0
  }
  ip_version: ipv4-6
  link_mode: passive
  secauth: on
  token_coefficient: 125
  version: 2
}

