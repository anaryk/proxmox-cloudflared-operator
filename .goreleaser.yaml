version: 2

project_name: pco

# A tag with a suffix after "-" sorts before the release it leads up to, as the
# versions of the packages do. Which tag a release is built from is not left to
# this: the release workflow names it in GORELEASER_CURRENT_TAG.
git:
  prerelease_suffix: "-"

builds:
  - id: pco
    main: ./cmd/pco
    binary: pco
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    # Keep it in sync with TAGS in the Makefile.
    tags:
      - nomsgpack
    # The same values the Makefile stamps. A release carries its tag, whatever
    # git describe says: it names an annotated tag first when a commit has two.
    # The date is the commit date rather than the time of the build, so that
    # building a tag twice gives the same binary.
    ldflags:
      - -s -w
      - -X github.com/anaryk/proxmox-cloudflared-operator/internal/version.Version={{ if .IsSnapshot }}{{ .Summary }}{{ else }}{{ .Tag }}{{ end }}
      - -X github.com/anaryk/proxmox-cloudflared-operator/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/anaryk/proxmox-cloudflared-operator/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats:
      - none

nfpms:
  - id: pco
    ids:
      - pco
    package_name: pco
    formats:
      - deb
    # scripts/install.sh downloads pco_<tag without the v>_<arch>.deb. Left to
    # itself nfpm writes a pre-release as 0.1.0~rc.1 in the file name too.
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Arch }}"
    maintainer: Tomáš Marek <tomas.marek@pellera.com>
    description: |-
      Cloudflare Tunnel operator for Proxmox VE
      pco runs on a Proxmox VE node and reads the hostnames that tagged guests
      list in their Notes. It publishes them through Cloudflare Tunnels, creating
      the DNS records and tunnel routes and running a cloudflared connector for
      each tunnel. Run pco setup after installing the package.
    homepage: https://github.com/anaryk/proxmox-cloudflared-operator
    license: MIT
    section: admin
    priority: optional
    bindir: /usr/bin
    mtime: "{{ .CommitDate }}"
    dependencies:
      - nftables
    recommends:
      - cloudflared
    contents:
      - src: packaging/systemd/pco.service
        dst: /usr/lib/systemd/system/pco.service
        file_info:
          mode: 0644
      - src: packaging/systemd/pco-cloudflared@.service
        dst: /usr/lib/systemd/system/pco-cloudflared@.service
        file_info:
          mode: 0644
      - src: packaging/systemd/pco-egress.service
        dst: /usr/lib/systemd/system/pco-egress.service
        file_info:
          mode: 0644
      - src: packaging/sysusers.d/pco.conf
        dst: /usr/lib/sysusers.d/pco.conf
        file_info:
          mode: 0644
      - src: README.md
        dst: /usr/share/doc/pco/README.md
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/doc/pco/copyright
        file_info:
          mode: 0644
    scripts:
      postinstall: packaging/scripts/postinstall.sh
      preremove: packaging/scripts/preremove.sh
      postremove: packaging/scripts/postremove.sh

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Only the checksum file is signed, with a binary detached signature, the form
# scripts/install.sh verifies. --snapshot does not skip this step, so a snapshot
# is built with --skip=sign: it has no key.
signs:
  - id: checksums
    artifacts: checksum
    cmd: gpg
    args:
      - --batch
      - --yes
      - --local-user
      - "{{ .Env.PCO_RELEASE_KEY_FPR }}"
      - --detach-sign
      - --output
      - ${signature}
      - ${artifact}
    signature: ${artifact}.sig

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - "^ci:"
      - "^docs:"
      - "^test:"

# A release is made as a draft, checked by the release workflow, and published
# by it only after every check passed. A draft left by an earlier run of the
# same tag is replaced.
release:
  draft: true
  replace_existing_draft: true
  prerelease: auto
