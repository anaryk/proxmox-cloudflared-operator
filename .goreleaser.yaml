version: 2

project_name: pco

# A tag with a suffix after "-" sorts before the release it leads up to, as the
# versions of the packages do. Which tag a release is built from is not left to
# this: the release workflow names it in GORELEASER_CURRENT_TAG.
git:
  prerelease_suffix: "-"

# The interface is built before goreleaser runs, by make ui or by the ui job of
# the workflows, never here: in a release this runs after the key import, and
# nothing of npm may run on a runner that holds the key.
before:
  hooks:
    - test -f internal/web/ui/dist/index.html

builds:
  - id: pco
    main: ./cmd/pco
    binary: pco
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    # Keep it in sync with TAGS in the Makefile; a package always carries the
    # interface, which packaging/check-artifacts.sh --require-ui checks.
    tags:
      - nomsgpack
      - webui
    # The same values the Makefile stamps. A release carries its tag, whatever
    # git describe says: it names an annotated tag first when a commit has two.
    # The date is the commit date rather than the time of the build, so that
    # building a tag twice gives the same binary.
    ldflags:
      - -s -w
      - -X github.com/anaryk/proxmox-cloudflared-operator/internal/version.Version={{ if .IsSnapshot }}{{ .Summary }}{{ else }}{{ .Tag }}{{ end }}
      - -X github.com/anaryk/proxmox-cloudflared-operator/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/anaryk/proxmox-cloudflared-operator/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats:
      - none

nfpms:
  - id: pco
    ids:
      - pco
    package_name: pco
    formats:
      - deb
    # scripts/install.sh downloads pco_<tag without the v>_<arch>.deb. Left to
    # itself nfpm writes a pre-release as 0.1.0~rc.1 in the file name too.
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Arch }}"
    maintainer: Tomáš Marek <tomas.marek@computer-solutions.cz>
    description: |-
      Cloudflare Tunnel operator for Proxmox VE
      pco runs on a Proxmox VE node and reads the hostnames that tagged guests
      list in their Notes. It publishes them through Cloudflare Tunnels, creating
      the DNS records and tunnel routes and running a cloudflared connector for
      each tunnel. Run pco setup after installing the package.
    homepage: https://github.com/anaryk/proxmox-cloudflared-operator
    license: MIT
    section: admin
    priority: optional
    bindir: /usr/bin
    mtime: "{{ .CommitDate }}"
    dependencies:
      - nftables
      - systemd | systemd-standalone-sysusers | systemd-sysusers
    recommends:
      - cloudflared
    contents:
      - src: packaging/systemd/pco.service
        dst: /usr/lib/systemd/system/pco.service
        file_info:
          mode: 0644
      - src: packaging/systemd/pco-cloudflared@.service
        dst: /usr/lib/systemd/system/pco-cloudflared@.service
        file_info:
          mode: 0644
      - src: packaging/systemd/pco-egress.service
        dst: /usr/lib/systemd/system/pco-egress.service
        file_info:
          mode: 0644
      # Exactly here: the daemon answers the user pco-web on its socket only
      # while this file exists.
      - src: packaging/systemd/pco-web.service
        dst: /usr/lib/systemd/system/pco-web.service
        file_info:
          mode: 0644
      - src: packaging/sysusers.d/pco.conf
        dst: /usr/lib/sysusers.d/pco.conf
        file_info:
          mode: 0644
      - src: README.md
        dst: /usr/share/doc/pco/README.md
        file_info:
          mode: 0644
      # The pages and docs/images, the screenshots they show: docs/ may hold only
      # what ships. Names with an extension and without a leading dot ship, in
      # docs/ and one directory down; dotfiles and anything deeper do not. One
      # glob for both, as nfpm fails on a glob that matches nothing, which
      # docs/images/* would before the first screenshot. The empty first choice
      # is needed: the glob library of nfpm matches nothing when the first
      # choice starts with a bracket.
      - src: "docs/{,[!.]*.*,[!.]*/[!.]*.*}"
        dst: /usr/share/doc/pco/docs
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/doc/pco/copyright
        file_info:
          mode: 0644
      # The notices of the frontend packages the binary carries, also served
      # as /licenses.txt.
      - src: internal/web/ui/dist/licenses.txt
        dst: /usr/share/doc/pco/web-licenses.txt
        file_info:
          mode: 0644
    scripts:
      postinstall: packaging/scripts/postinstall.sh
      preremove: packaging/scripts/preremove.sh
      postremove: packaging/scripts/postremove.sh

checksum:
  name_template: checksums.txt
  algorithm: sha256
  # The appliance templates and what goes with them, which
  # packaging/appliance/build.sh writes outside dist/, as --clean empties it,
  # into the directory PCO_APPLIANCE_DIR names. Without the variable, as in a
  # snapshot, there are none. The two single files fail the run when they are
  # missing; a missing template is found by check-artifacts.sh
  # --require-template.
  extra_files: &appliance
    - glob: '{{ with index .Env "PCO_APPLIANCE_DIR" }}{{ . }}/pco-appliance_{{ $.Version }}_{amd64,arm64}.{tar.zst,spdx.json}{{ end }}'
    - glob: '{{ with index .Env "PCO_APPLIANCE_DIR" }}{{ . }}/pco-appliance_{{ $.Version }}.pin.conf{{ end }}'
    - glob: '{{ with index .Env "PCO_APPLIANCE_DIR" }}{{ . }}/cloudflared-versions.json{{ end }}'

# Only the checksum file is signed, with a binary detached signature, the form
# scripts/install.sh verifies. --snapshot does not skip this step, so a snapshot
# is built with --skip=sign: it has no key.
signs:
  - id: checksums
    artifacts: checksum
    cmd: gpg
    args:
      - --batch
      - --yes
      - --local-user
      - "{{ .Env.PCO_RELEASE_KEY_FPR }}"
      - --detach-sign
      - --output
      - ${signature}
      - ${artifact}
    signature: ${artifact}.sig

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - "^ci:"
      - "^docs:"
      - "^test:"

# A release is made as a draft and checked by the release workflow, and the
# maintainer publishes it. A draft left by an earlier run of the same tag is
# replaced. The body of the tag's message, if it has one, heads the notes: the
# monthly rebuild of the template writes there what changed.
release:
  draft: true
  replace_existing_draft: true
  prerelease: auto
  header: "{{ .TagBody }}"
  extra_files: *appliance
