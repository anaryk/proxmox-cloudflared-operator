version: "2"

run:
  # Kept in sync with TAGS in the Makefile.
  build-tags:
    - nomsgpack

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nolintlint
    - unconvert
    - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/anaryk/proxmox-cloudflared-operator
