version: "2"

run:
  # nomsgpack is kept in sync with TAGS in the Makefile; scale and e2e have
  # the benchmark and the end-to-end suite checked as well.
  build-tags:
    - nomsgpack
    - scale
    - e2e

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nolintlint
    - unconvert
    - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/anaryk/proxmox-cloudflared-operator
