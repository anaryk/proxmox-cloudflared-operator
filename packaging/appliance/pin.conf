# The snapshot of snapshot.debian.org the appliance template is built from,
# as YYYYMMDDTHHMMSSZ. It is also the time every file of the template carries,
# so two builds from the same snapshot are the same, byte for byte. The
# template workflow builds from the current snapshot every month; a release
# can name another one (see README.md).
SNAPSHOT=20261004T000000Z

# The debian-archive-keyring package of trixie in that snapshot and its sha256,
# as the signed Packages file of the snapshot lists it. Its keyring is what apt
# checks the archives against, for a build from any snapshot.
KEYRING_VERSION=2025.1
KEYRING_SHA256=9ea7778e443144ca490668737a8ab22dd3e748bb99e805e22ec055abeb3c7fac
