# In the appliance pco starts behind pco-net.service. Without the marker of
# its volume it exits with 78 and stays failed rather than starting again
# every 5 s: pco appliance repair on the node is what helps then. Under memory
# pressure the kernel ends pco before a connector, whose own score the user
# namespace of the container does not let it lower.
[Unit]
Requires=pco-net.service
After=pco-net.service

[Service]
RestartPreventExitStatus=78
OOMScoreAdjust=500
