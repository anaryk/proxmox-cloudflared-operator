# In the appliance a connector starts only behind pco-net.service, which keeps
# the service prefix in the container, and only once the daemon has proved in
# this boot that the container is the appliance and not a copy of it: it
# writes the flag then, and removes it on a copy. An unmet condition skips the
# start without a failure; the daemon starts the connectors at its next cycle.
[Unit]
Requires=pco-net.service
After=pco-net.service
ConditionPathExists=/run/pco-appliance/identity-ok
