# In the appliance pco-web signs users in at the node's API as the daemon
# reaches it, which the daemon writes into pve-api.json, and there is no
# pveproxy in the container to pin. The daemon makes the key and the
# certificate too, so pco-web starts after it.
[Unit]
After=pco.service

[Service]
LoadCredential=
LoadCredential=tls.crt:/etc/pco/web/tls.crt
LoadCredential=tls.key:/etc/pco/web/tls.key
LoadCredential=pve-api.json:/etc/pco/web/pve-api.json
